<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>鑳介噺璁＄畻鍣?/title>
<style>
:root{--primary:#0EA5E9;--primary-light:#E0F2FE;--primary-dark:#0369A1;--orange:#F97316;--orange-light:#FFEDD5;--success:#22C55E;--success-light:#D1FAE5;--purple:#A855F7;--purple-light:#EDE9FE;--red:#EF4444;--bg:#F0F9FF;--card-bg:#FFFFFF;--text-main:#0F172A;--text-muted:#64748B;--text-light:#94A3B8;--border:#E2E8F0;--shadow:0 4px 20px rgba(14,165,233,.06);--radius-sm:12px;--radius-md:16px;--radius-lg:24px;--radius-xl:32px;--transition:.25s ease}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text-main);min-height:100vh;-webkit-font-smoothing:antialiased;overflow-x:hidden}
.page{max-width:480px;margin:0 auto;min-height:100vh;position:relative;padding-bottom:80px}
.header{display:flex;align-items:center;gap:12px;padding:52px 20px 16px;position:sticky;top:0;z-index:50;background:var(--bg)}
.nav-back{width:40px;height:40px;display:flex;align-items:center;justify-content:center;background:var(--orange-light);border-radius:12px;cursor:pointer;transition:all var(--transition);flex-shrink:0}
.nav-back:active{transform:scale(.92);opacity:.8}
.nav-back svg{width:20px;height:20px;color:var(--orange)}
.header-title{font-size:22px;font-weight:800;color:var(--text-main);flex:1}
.hero-banner{margin:0 16px 12px;border-radius:var(--radius-lg);padding:20px;position:relative;overflow:hidden;background:linear-gradient(135deg,#fff7ed,#ffedd5);border:1px solid rgba(249,115,22,.12);box-shadow:0 4px 20px rgba(251,146,60,.12)}
.hero-banner .gradient-flow{position:absolute;top:-50%;left:-50%;width:200%;height:200%;background:linear-gradient(45deg,transparent,rgba(251,146,60,.2),transparent,rgba(253,186,116,.2),transparent);animation:gradientFlow 4s ease-in-out infinite}
@keyframes gradientFlow{0%{transform:translate(-30%,-30%) rotate(0deg)}50%{transform:translate(10%,10%) rotate(180deg)}100%{transform:translate(-30%,-30%) rotate(360deg)}}
.hero-content{position:relative;z-index:1;display:flex;align-items:center;gap:14px}
.hero-icon{width:48px;height:48px;background:linear-gradient(135deg,#f97316,#ea580c);border-radius:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 4px 16px rgba(234,88,12,.35)}
.hero-icon svg{width:24px;height:24px;color:#fff}
.hero-text{flex:1}
.hero-text h2{font-size:16px;font-weight:700;color:#1e293b;margin-bottom:2px}
.hero-text p{font-size:11px;color:#475569;line-height:1.4}
.hero-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px;position:relative;z-index:1}
.hero-stat{background:rgba(255,255,255,.75);backdrop-filter:blur(10px);border-radius:12px;padding:10px 6px;text-align:center;border:1px solid rgba(255,255,255,.6)}
.hero-stat .stat-value{font-size:20px;font-weight:800;background:linear-gradient(135deg,#f97316,#ea580c);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1.2;display:inline-block;transition:all .3s ease}
.hero-stat .stat-label{font-size:10px;font-weight:600;color:var(--text-light);margin-top:2px}
.sync-row{display:flex;gap:8px;margin:0 16px 12px}
.sync-btn{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:10px 14px;border-radius:var(--radius-sm);background:linear-gradient(135deg,#ede9fe,#ddd6fe);border:1.5px solid rgba(168,85,247,.2);font-size:13px;font-weight:700;color:#6d28d9;cursor:pointer;font-family:inherit;transition:all var(--transition)}
.sync-btn:active{transform:scale(.97)}
.sync-btn:hover{background:linear-gradient(135deg,#ddd6fe,#ede9fe);border-color:rgba(168,85,247,.4)}
.sync-btn svg{width:16px;height:16px}
.sync-btn.syncing svg{animation:spin .8s linear infinite}
@keyframes spin{100%{transform:rotate(360deg)}}
.try-example-btn{display:flex;align-items:center;justify-content:center;gap:6px;padding:10px 14px;border-radius:var(--radius-sm);background:linear-gradient(135deg,#e0f2fe,#bae6fd);border:1.5px solid rgba(14,165,233,.2);font-size:13px;font-weight:700;color:var(--primary-dark);cursor:pointer;font-family:inherit;transition:all var(--transition)}
.try-example-btn:active{transform:scale(.97)}
.try-example-btn svg{width:16px;height:16px}
.scenario-selector{margin:0 16px 12px;padding:14px;background:var(--card-bg);border-radius:var(--radius-md);border:1.5px solid rgba(168,85,247,.15);box-shadow:0 2px 12px rgba(168,85,247,.06);animation:hintFadeIn .3s ease}
.scenario-label{font-size:12px;font-weight:700;color:#6d28d9;margin-bottom:10px}
.scenario-list{display:flex;flex-direction:column;gap:8px}
.scenario-item{padding:10px 12px;border-radius:10px;border:1.5px solid var(--border);background:#f8fafc;cursor:pointer;transition:all var(--transition);display:flex;align-items:center;gap:10px}
.scenario-item:hover{border-color:rgba(168,85,247,.3);background:#faf5ff}
.scenario-item.active{border-color:#a855f7;background:var(--purple-light)}
.scenario-item .scenario-icon{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;background:linear-gradient(135deg,#ede9fe,#ddd6fe)}
.scenario-item .scenario-info{flex:1}
.scenario-item .scenario-name{font-size:12px;font-weight:700;color:var(--text-main)}
.scenario-item .scenario-desc{font-size:10px;color:var(--text-light);margin-top:1px}
.scenario-item .scenario-apply{padding:4px 10px;border-radius:6px;background:linear-gradient(135deg,#a855f7,#7c3aed);color:#fff;font-size:11px;font-weight:700;border:none;cursor:pointer;font-family:inherit;flex-shrink:0}
.scenario-item .scenario-apply:active{transform:scale(.95)}
.date-sync-section{margin-top:12px;padding-top:12px;border-top:1px dashed var(--border)}
.date-sync-title{font-size:12px;font-weight:700;color:var(--primary-dark);margin-bottom:8px;display:flex;align-items:center;gap:4px}
.date-sync-title svg{width:14px;height:14px}
.date-sync-row{display:flex;align-items:center;gap:8px}
.date-sync-label{font-size:11px;font-weight:600;color:var(--text-muted);white-space:nowrap}
.date-sync-input{flex:1;height:34px;background:#f8fafc;border:1.5px solid var(--border);border-radius:8px;padding:0 10px;font-size:13px;font-family:inherit;color:var(--text-main);outline:none;transition:all var(--transition)}
.date-sync-input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(14,165,233,.1)}
.date-sync-btn{padding:7px 14px;border-radius:8px;background:linear-gradient(135deg,#0ea5e9,#0284c7);color:#fff;font-size:12px;font-weight:700;border:none;cursor:pointer;font-family:inherit;white-space:nowrap;display:flex;align-items:center;gap:4px}
.date-sync-btn:active{transform:scale(.95)}
.date-sync-btn svg{width:14px;height:14px}
.date-sync-hint{font-size:10px;color:var(--text-light);margin-top:6px;display:flex;align-items:center;gap:4px}
.date-sync-hint svg{width:12px;height:12px;flex-shrink:0}
.tab-nav{display:flex;margin:0 16px 2px;background:var(--card-bg);border-radius:var(--radius-sm);padding:4px;gap:4px;box-shadow:0 1px 4px rgba(0,0,0,.04);position:sticky;top:0;z-index:40}
.tab-btn{flex:1;display:flex;align-items:center;justify-content:center;gap:4px;padding:10px 8px;border-radius:10px;border:none;font-size:13px;font-weight:600;color:var(--text-muted);background:transparent;cursor:pointer;font-family:inherit;transition:all var(--transition)}
.tab-btn svg{width:16px;height:16px}
.tab-btn.active{background:var(--primary);color:#fff;box-shadow:0 2px 8px rgba(14,165,233,.3)}
.tab-btn:active{transform:scale(.97)}
.tab-panel{display:none;padding:12px 16px;animation:hintFadeIn .3s ease}
.tab-panel.active{display:block}
@keyframes hintFadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.calc-card{background:var(--card-bg);border-radius:var(--radius-xl);padding:20px;margin-bottom:12px;box-shadow:var(--shadow);border:1px solid rgba(14,165,233,.05);position:relative;overflow:hidden;transition:border .4s ease,box-shadow .4s ease}
.calc-card.pending{border:1.5px dashed var(--border);box-shadow:none}
.calc-card.ready{border:1px solid rgba(14,165,233,.1);box-shadow:var(--shadow)}
.card-header{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.card-icon{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.card-icon svg{width:20px;height:20px}
.card-icon.bmr-icon{background:linear-gradient(135deg,#fef3c7,#fde68a);color:#b45309}
.card-icon.tdee-icon{background:linear-gradient(135deg,#e0f2fe,#bae6fd);color:#0369a1}
.card-icon.exercise-icon{background:linear-gradient(135deg,#dcfce7,#bbf7d0);color:#047857}
.card-icon.goal-icon{background:linear-gradient(135deg,#ede9fe,#ddd6fe);color:#6d28d9}
.card-icon.diet-icon{background:linear-gradient(135deg,#fef3c7,#fde68a);color:#b45309}
.card-icon.water-icon{background:linear-gradient(135deg,#e0f2fe,#bae6fd);color:#0369a1}
.card-icon.bmi-icon{background:linear-gradient(135deg,#fce7f3,#fbcfe8);color:#be185d}
.card-title-group{flex:1}
.card-title{font-size:15px;font-weight:700;color:var(--text-main);line-height:1.2}
.card-subtitle{font-size:11px;color:var(--text-light);margin-top:1px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form-field{display:flex;flex-direction:column;gap:4px}
.form-label{font-size:11px;font-weight:600;color:var(--text-muted)}
.form-input{height:42px;background:#f8fafc;border:1.5px solid var(--border);border-radius:var(--radius-sm);padding:0 38px 0 12px;font-size:14px;font-weight:500;color:var(--text-main);outline:none;transition:all var(--transition);font-family:inherit;width:100%}
.form-input::placeholder{color:var(--text-light);font-weight:400}
.form-input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(14,165,233,.1);background:#fff}
.input-wrapper{position:relative}
.input-unit{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:11px;font-weight:600;color:var(--text-light);pointer-events:none}
.gender-selector{display:flex;gap:8px}
.gender-btn{flex:1;height:42px;display:flex;align-items:center;justify-content:center;gap:4px;background:#f8fafc;border:1.5px solid var(--border);border-radius:var(--radius-sm);font-size:13px;font-weight:600;color:var(--text-muted);cursor:pointer;font-family:inherit;transition:all var(--transition)}
.gender-btn svg{width:16px;height:16px}
.gender-btn.active{background:var(--primary-light);border-color:var(--primary);color:var(--primary-dark)}
.result-display{text-align:center;padding:16px 0 0;margin-top:14px;border-top:1px solid rgba(0,0,0,.04)}
.result-number{font-size:40px;font-weight:800;line-height:1;transition:all .3s ease;display:inline-block}
.result-number.animating{animation:numberPop .35s ease}
@keyframes numberPop{0%{transform:scale(1)}40%{transform:scale(1.08)}100%{transform:scale(1)}}
.bmr-result .result-number{color:var(--orange)}
.tdee-result .result-number{color:var(--primary)}
.exercise-result .result-number{color:var(--success)}
.goal-result .result-number{color:var(--purple)}
.result-unit{font-size:12px;color:var(--text-light);margin-top:4px;font-weight:500}
.placeholder-state .result-number{color:var(--text-light);font-size:32px}
.placeholder-state .result-desc{display:none}
.placeholder-hint{display:flex;align-items:center;justify-content:center;gap:6px;font-size:12px;color:var(--text-light);margin-top:8px;padding:8px 12px;background:#f8fafc;border-radius:8px}
.placeholder-hint svg{width:14px;height:14px;flex-shrink:0}
.result-desc{font-size:12px;color:var(--text-muted);margin-top:4px}
.state-changed{animation:stateFlash .35s ease}
@keyframes stateFlash{0%{opacity:.5;transform:scale(.95)}50%{opacity:1;transform:scale(1.02)}100%{opacity:1;transform:scale(1)}}
.activity-list{display:flex;flex-direction:column;gap:6px}
.activity-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--radius-sm);border:1.5px solid var(--border);cursor:pointer;transition:all var(--transition);background:#fff}
.activity-item.active{border-color:var(--primary);background:var(--primary-light)}
.activity-item:active{transform:scale(.98)}
.activity-dot{width:8px;height:8px;border-radius:50%;background:var(--border);transition:all var(--transition);flex-shrink:0}
.activity-item.active .activity-dot{background:var(--primary);box-shadow:0 0 0 3px rgba(14,165,233,.2)}
.activity-info{flex:1}
.activity-name{font-size:13px;font-weight:600;color:var(--text-main)}
.activity-desc{font-size:10px;color:var(--text-light);margin-top:1px}
.activity-value{font-size:12px;font-weight:700;color:var(--text-muted)}
.goal-list{display:flex;flex-direction:column;gap:6px}
.goal-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--radius-sm);border:1.5px solid var(--border);cursor:pointer;transition:all var(--transition);background:#fff}
.goal-item.active{border-color:var(--purple);background:var(--purple-light)}
.goal-item:active{transform:scale(.98)}
.goal-info{flex:1}
.goal-name{font-size:13px;font-weight:600;color:var(--text-main)}
.goal-desc{font-size:10px;color:var(--text-light);margin-top:1px}
.goal-badge{font-size:11px;font-weight:700;padding:3px 8px;border-radius:6px}
.goal-badge.deficit{background:#fee2e2;color:#dc2626}
.goal-badge.neutral{background:#e0f2fe;color:#0369a1}
.goal-badge.surplus{background:#dcfce7;color:#16a34a}
.macro-bar{display:flex;height:8px;border-radius:4px;overflow:hidden;margin-top:14px;background:#f1f5f9}
.bar-protein{background:linear-gradient(90deg,#f97316,#fb923c);transition:width .5s ease}
.bar-carbs{background:linear-gradient(90deg,#0ea5e9,#38bdf8);transition:width .5s ease}
.bar-fat{background:linear-gradient(90deg,#a855f7,#c084fc);transition:width .5s ease}
.macro-details{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.macro-detail{text-align:center}
.macro-grams{font-size:16px;font-weight:700}
.macro-name{font-size:10px;color:var(--text-light);margin-top:1px}
.macro-pct{font-size:10px;font-weight:600}
.macro-detail.protein .macro-grams,.macro-detail.protein .macro-pct{color:var(--orange)}
.macro-detail.carbs .macro-grams,.macro-detail.carbs .macro-pct{color:var(--primary)}
.macro-detail.fat .macro-grams,.macro-detail.fat .macro-pct{color:var(--purple)}
.weekly-estimate{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:10px;font-size:12px;color:var(--text-muted)}
.weekly-estimate svg{width:14px;height:14px}
.macro-custom-btn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;margin-top:10px;padding:8px;border-radius:8px;background:#f8fafc;border:1px dashed var(--border);font-size:12px;font-weight:600;color:var(--text-muted);cursor:pointer;font-family:inherit;transition:all var(--transition)}
.macro-custom-btn:hover{background:var(--purple-light);border-color:rgba(168,85,247,.3);color:#6d28d9}
.macro-custom-btn svg{width:14px;height:14px}
.macro-custom-panel{max-height:0;overflow:hidden;transition:max-height .35s ease,padding .35s ease;padding:0 12px}
.macro-custom-panel.show{max-height:400px;padding:12px}
.macro-slider-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.macro-slider-label{font-size:12px;font-weight:600;color:var(--text-muted);width:60px;display:flex;align-items:center;gap:4px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.protein-dot{background:var(--orange)}
.carbs-dot{background:var(--primary)}
.fat-dot{background:var(--purple)}
.macro-slider{flex:1;-webkit-appearance:none;height:4px;border-radius:2px;outline:none}
.macro-slider.protein-slider{background:linear-gradient(90deg,#fdba74,#f97316)}
.macro-slider.carbs-slider{background:linear-gradient(90deg,#7dd3fc,#0ea5e9)}
.macro-slider.fat-slider{background:linear-gradient(90deg,#d8b4fe,#a855f7)}
.macro-slider-val{font-size:12px;font-weight:700;width:36px;text-align:right}
.macro-reset-btn{display:block;width:100%;padding:6px;border-radius:6px;background:#f1f5f9;border:none;font-size:11px;font-weight:600;color:var(--text-muted);cursor:pointer;font-family:inherit;margin-top:4px}
.macro-reset-btn:active{transform:scale(.96)}
.macro-validation{margin-top:8px;padding:8px 12px;border-radius:8px;font-size:12px;font-weight:600;display:flex;align-items:center;gap:6px;transition:all .3s ease;animation:hintFadeIn .3s ease}
.macro-validation.valid{background:#dcfce7;color:#16a34a;border:1px solid rgba(34,197,94,.2)}
.macro-validation.warning{background:#fef3c7;color:#b45309;border:1px solid rgba(245,158,11,.2)}
.macro-validation.error{background:#fee2e2;color:#dc2626;border:1px solid rgba(239,68,68,.2)}
.macro-validation svg{width:14px;height:14px;flex-shrink:0}
.macro-total-bar{margin-top:8px;height:6px;border-radius:3px;background:#e2e8f0;overflow:hidden}
.macro-total-bar-fill{height:100%;border-radius:3px;transition:width .3s ease,background .3s ease}
.macro-total-bar-fill.valid{background:linear-gradient(90deg,#22c55e,#4ade80)}
.macro-total-bar-fill.warning{background:linear-gradient(90deg,#f59e0b,#fbbf24)}
.macro-total-bar-fill.error{background:linear-gradient(90deg,#ef4444,#f87171)}
.exercise-add-row{display:flex;gap:8px;margin-bottom:10px}
.select-wrapper{flex:1;position:relative}
.select-trigger{height:42px;background:#f8fafc;border:1.5px solid var(--border);border-radius:var(--radius-sm);padding:0 32px 0 12px;font-size:13px;color:var(--text-muted);display:flex;align-items:center;cursor:pointer;transition:all var(--transition)}
.select-trigger.has-value{color:var(--text-main);font-weight:600}
.select-arrow{position:absolute;right:10px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--text-light);pointer-events:none;transition:transform var(--transition)}
.select-dropdown{position:absolute;top:calc(100% + 4px);left:0;right:0;background:var(--card-bg);border-radius:var(--radius-sm);box-shadow:0 8px 32px rgba(0,0,0,.12);border:1px solid var(--border);z-index:100;display:none;max-height:280px;overflow:hidden}
.select-dropdown.open{display:block;animation:hintFadeIn .2s ease}
.ex-search-wrap{position:relative;padding:8px;border-bottom:1px solid var(--border)}
.ex-search-icon{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:14px;height:14px;color:var(--text-light)}
.ex-search-input{width:100%;height:32px;background:#f8fafc;border:1px solid var(--border);border-radius:8px;padding:0 10px 0 30px;font-size:12px;outline:none;font-family:inherit}
.ex-search-input:focus{border-color:var(--primary)}
.ex-category-tabs{display:flex;gap:4px;padding:6px 8px;border-bottom:1px solid var(--border);overflow-x:auto}
.ex-cat-tab{padding:4px 10px;border-radius:6px;font-size:11px;font-weight:600;color:var(--text-muted);background:#f8fafc;border:none;cursor:pointer;font-family:inherit;white-space:nowrap;transition:all var(--transition)}
.ex-cat-tab.active{background:var(--primary);color:#fff}
.ex-options-list{max-height:180px;overflow-y:auto;padding:4px}
.ex-option{padding:8px 10px;border-radius:8px;font-size:12px;font-weight:500;color:var(--text-main);cursor:pointer;transition:all var(--transition)}
.ex-option:hover{background:var(--primary-light)}
.ex-option.selected{background:var(--primary-light);color:var(--primary-dark);font-weight:700}
.exercise-add-btn{display:flex;align-items:center;justify-content:center;gap:4px;padding:0 14px;border-radius:var(--radius-sm);background:linear-gradient(135deg,#22c55e,#16a34a);color:#fff;font-size:13px;font-weight:700;border:none;cursor:pointer;font-family:inherit;transition:all var(--transition)}
.exercise-add-btn:active{transform:scale(.95)}
.exercise-add-btn svg{width:16px;height:16px}
.exercise-list{display:flex;flex-direction:column;gap:6px}
.exercise-list-empty{text-align:center;padding:16px;font-size:12px;color:var(--text-light)}
.exercise-list-empty svg{width:24px;height:24px;color:var(--text-light)}
.exercise-item{background:#f8fafc;border-radius:10px;padding:10px 12px;border:1px solid var(--border);transition:all .3s ease;animation:exerciseSlideIn .35s ease;max-height:200px;overflow:hidden}
.exercise-item.removing{animation:exerciseSlideOut .45s cubic-bezier(.4,0,.2,1) forwards;pointer-events:none;border-color:#fecaca;background:#fef2f2}
.exercise-item.removing .ex-remove{background:#dc2626;color:#fff;border-color:#dc2626;transform:rotate(90deg)}
.exercise-item.removing .ex-cal{color:#dc2626;text-decoration:line-through}
@keyframes exerciseSlideIn{from{opacity:0;transform:translateY(-12px) scale(.94)}to{opacity:1;transform:translateY(0) scale(1)}}

  { key: 'strength', label: '鍔涢噺' },

  { key: 'flexibility', label: '鏌旈煣' },
  { key: 'sports', label: '鐞冪被' }
];

var SYNC_SCENARIOS = [

  { name: '杞诲害杩愬姩鏃?, icon: '馃毝', desc: '蹇蛋30鍒嗛挓 + 姝ｅ父楗', data: { exercises: [{ key: 'walking_fast', duration: 30 }], dietCalories: 2100, activityLevel: 'light' } },
  { name: '鍔涢噺璁粌鏃?, icon: '馃弸锔?, desc: '鍔涢噺璁粌60鍒嗛挓 + 楂樿泲鐧介ギ椋?, data: { exercises: [{ key: 'strength_training', duration: 60 }, { key: 'bench_press', duration: 20 }], dietCalories: 2400, activityLevel: 'moderate' } },
  { name: '鏈夋哀璁粌鏃?, icon: '馃弮', desc: '璺戞40鍒嗛挓 + 鎺у埗楗', data: { exercises: [{ key: 'running_10kmh', duration: 40 }], dietCalories: 2000, activityLevel: 'moderate' } },
  { name: '楂樺己搴︽棩', icon: '馃敟', desc: 'HIIT + 鍔涢噺 + 琛ュ厖楗', data: { exercises: [{ key: 'hiit', duration: 30 }, { key: 'squat', duration: 30 }], dietCalories: 2600, activityLevel: 'active' } }
];

var MOCK_HISTORY_DATA = {};
(function() {
  var today = new Date();
  for (var i = 1; i <= 30; i++) {
    var d = new Date(today);
    d.setDate(d.getDate() - i);
    var key = d.toISOString().split('T')[0];
    var scenarioIdx = Math.floor(Math.random() * SYNC_SCENARIOS.length);
    MOCK_HISTORY_DATA[key] = SYNC_SCENARIOS[scenarioIdx].data;
  }
})();

function init() {
  renderActivityList();
  renderGoalList();
  renderScenarioList();
  renderExerciseDropdown();
  var dateInput = document.getElementById('date-sync-input');
  dateInput.max = new Date().toISOString().split('T')[0];
}

function selectGender(g) {
  state.gender = g;
  document.querySelectorAll('.gender-btn').forEach(function(btn) {
    btn.classList.toggle('active', btn.dataset.gender === g);
  });
  calculate();
}

function calculate() {
  state.age = parseInt(document.getElementById('age-input').value) || 0;
  state.height = parseFloat(document.getElementById('height-input').value) || 0;
  state.weight = parseFloat(document.getElementById('weight-input').value) || 0;

  if (state.gender && state.age > 0 && state.height > 0 && state.weight > 0) {
    var base = 10 * state.weight + 6.25 * state.height - 5 * state.age;
    state.bmr = Math.round(base + (state.gender === 'male' ? 5 : -161));
    updateBMRResult();
    calculateTDEE();
  } else {
    state.bmr = 0;
    document.getElementById('bmr-result').innerHTML = '<div class="placeholder-state"><div class="result-number">--</div><div class="result-unit">kcal/澶?/div><div class="placeholder-hint"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>濉啓韬綋鏁版嵁鍚庤嚜鍔ㄨ绠?/div></div>';
    document.getElementById('bmr-card').className = 'calc-card pending';
    document.getElementById('hero-bmr').textContent = '--';
    state.tdee = 0;
    document.getElementById('tdee-result').innerHTML = '<div class="placeholder-state"><div class="result-number">--</div><div class="result-unit">kcal/澶?/div></div>';
    document.getElementById('tdee-card').className = 'calc-card pending';
    document.getElementById('hero-tdee').textContent = '--';
    state.targetCalories = 0;
    document.getElementById('goal-result').innerHTML = '<div class="placeholder-state"><div class="result-number">--</div><div class="result-unit">kcal/澶?/div></div>';
    document.getElementById('goal-card').className = 'calc-card pending';
    document.getElementById('hero-target').textContent = '--';
    document.getElementById('macro-section').classList.add('hidden');
  }
  updateInsights();
  updateEnergyBalance();
}

function updateBMRResult() {
  document.getElementById('bmr-result').innerHTML = '<div class="result-number animating">' + state.bmr + '</div><div class="result-unit">kcal/澶?/div><div class="result-desc">缁存寔鐢熷懡鏈€浣庤兘閲忔秷鑰?/div>';
  document.getElementById('bmr-card').className = 'calc-card ready';
  animateHeroStat('hero-bmr', state.bmr);
}

function calculateTDEE() {
  if (!state.bmr) return;
  var level = ACTIVITY_LEVELS.find(function(l) { return l.key === state.activityLevel; });
  state.tdee = Math.round(state.bmr * (level ? level.value : 1.20));
  document.getElementById('tdee-result').innerHTML = '<div class="result-number animating">' + state.tdee + '</div><div class="result-unit">kcal/澶?/div><div class="result-desc">姣忔棩鎬昏兘閲忔秷鑰?/div>';
  document.getElementById('tdee-card').className = 'calc-card ready';
  animateHeroStat('hero-tdee', state.tdee);
  calculateTarget();
}

function calculateTarget() {
  if (!state.tdee) return;
  var goal = GOAL_OPTIONS.find(function(g) { return g.key === state.goal; }) || GOAL_OPTIONS[2];
  state.targetCalories = Math.max(state.tdee + goal.adjustment, 1200);
  document.getElementById('goal-result').innerHTML = '<div class="result-number animating">' + state.targetCalories + '</div><div class="result-unit">kcal/澶?/div><div class="result-desc">寤鸿姣忔棩鎽勫叆</div>';
  document.getElementById('goal-card').className = 'calc-card ready';
  animateHeroStat('hero-target', state.targetCalories);
  document.getElementById('macro-section').classList.remove('hidden');
  updateMacros();
  var weeklyKg = Math.abs((goal.adjustment * 7) / 7700).toFixed(2);
  document.getElementById('weekly-text').textContent = '棰勮鍛ㄥ彉鍖栵細' + weeklyKg + 'kg';
}

function updateMacros() {
  if (!state.targetCalories) return;
  var p = state.macroPct.protein / 100;
  var c = state.macroPct.carbs / 100;
  var f = state.macroPct.fat / 100;
  var proteinG = Math.round(state.targetCalories * p / 4);
  var carbsG = Math.round(state.targetCalories * c / 4);
  var fatG = Math.round(state.targetCalories * f / 9);
  document.getElementById('protein-g').textContent = proteinG + 'g';
  document.getElementById('carbs-g').textContent = carbsG + 'g';
  document.getElementById('fat-g').textContent = fatG + 'g';
  document.querySelectorAll('.macro-detail.protein .macro-pct').forEach(function(el) { el.textContent = state.macroPct.protein + '%'; });
  document.querySelectorAll('.macro-detail.carbs .macro-pct').forEach(function(el) { el.textContent = state.macroPct.carbs + '%'; });
  document.querySelectorAll('.macro-detail.fat .macro-pct').forEach(function(el) { el.textContent = state.macroPct.fat + '%'; });
  document.querySelector('.bar-protein').style.width = state.macroPct.protein + '%';
  document.querySelector('.bar-carbs').style.width = state.macroPct.carbs + '%';
  document.querySelector('.bar-fat').style.width = state.macroPct.fat + '%';
}

function animateHeroStat(id, value) {
  var el = document.getElementById(id);
  el.textContent = value;
  el.style.transform = 'scale(1.1)';
  setTimeout(function() { el.style.transform = 'scale(1)'; }, 200);
}

function renderActivityList() {
  var html = '';
  ACTIVITY_LEVELS.forEach(function(level) {
    html += '<div class="activity-item' + (level.key === state.activityLevel ? ' active' : '') + '" onclick="selectActivity(\'' + level.key + '\')">' +
      '<div class="activity-dot"></div><div class="activity-info"><div class="activity-name">' + level.label + '</div><div class="activity-desc">' + level.desc + '</div></div>' +
      '<div class="activity-value">x' + level.value + '</div></div>';
  });
  document.getElementById('activity-list').innerHTML = html;
}

function selectActivity(key) {
  state.activityLevel = key;
  renderActivityList();
  if (state.bmr) calculateTDEE();
}

function renderGoalList() {
  var html = '';
  GOAL_OPTIONS.forEach(function(goal) {
    html += '<div class="goal-item' + (goal.key === state.goal ? ' active' : '') + '" onclick="selectGoal(\'' + goal.key + '\')">' +
      '<div class="goal-info"><div class="goal-name">' + goal.label + '</div><div class="goal-desc">' + goal.desc + '</div></div>' +
      '<div class="goal-badge ' + goal.badge + '">' + (goal.adjustment > 0 ? '+' : '') + goal.adjustment + '</div></div>';
  });
  document.getElementById('goal-list').innerHTML = html;
}

function selectGoal(key) {
  state.goal = key;
  renderGoalList();
  if (state.tdee) calculateTarget();
}

function toggleMacroPanel() {
  document.getElementById('macro-custom-panel').classList.toggle('show');
}

function updateMacroSliders() {
  var p = parseInt(document.getElementById('protein-slider').value);
  var c = parseInt(document.getElementById('carbs-slider').value);
  var f = parseInt(document.getElementById('fat-slider').value);
  state.macroPct = { protein: p, carbs: c, fat: f };
  document.getElementById('protein-val').textContent = p + '%';
  document.getElementById('carbs-val').textContent = c + '%';
  document.getElementById('fat-val').textContent = f + '%';
  var total = p + c + f;
  var validation = document.getElementById('macro-validation');
  var validationText = document.getElementById('macro-validation-text');
  var barFill = document.getElementById('macro-total-bar-fill');
  barFill.style.width = Math.min(total, 100) + '%';
  validation.className = 'macro-validation';
  if (total === 100) {
    validation.classList.add('valid');
    validationText.textContent = '姣斾緥鍚堣 100%锛岄厤缃湁鏁?;
    barFill.className = 'macro-total-bar-fill valid';
  } else if (total > 95 && total < 105) {
    validation.classList.add('warning');
    validationText.textContent = '姣斾緥鍚堣 ' + total + '%锛屾帴杩?00%浣嗘湭杈炬爣';
    barFill.className = 'macro-total-bar-fill warning';
  } else {
    validation.classList.add('error');
    validationText.textContent = '姣斾緥鍚堣 ' + total + '%锛岄渶璋冩暣涓?00%';
    barFill.className = 'macro-total-bar-fill error';
  }
  updateMacros();
}

function resetMacroSliders() {
  state.macroPct = { protein: 30, carbs: 40, fat: 30 };
  document.getElementById('protein-slider').value = 30;
  document.getElementById('carbs-slider').value = 40;
  document.getElementById('fat-slider').value = 30;
  updateMacroSliders();
}

function switchTab(tab) {
  document.querySelectorAll('.tab-btn').forEach(function(btn, i) {
    var tabs = ['calc', 'today', 'insight'];
    btn.classList.toggle('active', tabs[i] === tab);
  });
  document.querySelectorAll('.tab-panel').forEach(function(panel) {
    panel.classList.remove('active');
  });
  document.getElementById('tab-' + tab).classList.add('active');
}

function toggleScenarioSelector() {
  var el = document.getElementById('scenario-selector');
  el.classList.toggle('hidden');
}

function renderScenarioList() {
  var html = '';
  SYNC_SCENARIOS.forEach(function(s, i) {
    html += '<div class="scenario-item" onclick="applyScenario(' + i + ')">' +
      '<div class="scenario-icon">' + s.icon + '</div><div class="scenario-info"><div class="scenario-name">' + s.name + '</div><div class="scenario-desc">' + s.desc + '</div></div>' +
      '<button class="scenario-apply">搴旂敤</button></div>';
  });
  document.getElementById('scenario-list').innerHTML = html;
}

function applyScenario(idx) {
  var scenario = SYNC_SCENARIOS[idx];
  var data = scenario.data;
  var syncBtn = document.getElementById('sync-btn');
  syncBtn.classList.add('syncing');
  setTimeout(function() {
    syncBtn.classList.remove('syncing');
    state.exercises = [];
    state.syncedExerciseCalories = 0;
    data.exercises.forEach(function(ex) {
      var exData = EXERCISE_DB[ex.key];
      if (exData) {
        var cal = Math.round(exData.met * state.weight * (ex.duration / 60));
        state.exercises.push({ key: ex.key, name: exData.name, met: exData.met, duration: ex.duration, calories: cal });
        state.syncedExerciseCalories += cal;
      }
    });
    state.syncedDietCalories = data.dietCalories;
    if (data.activityLevel) {
      state.activityLevel = data.activityLevel;
      renderActivityList();
      if (state.bmr) calculateTDEE();
    }
    renderExerciseList();
    renderSyncedDietList();
    updateEnergyBalance();
    updateInsights();
    document.getElementById('scenario-selector').classList.add('hidden');
    calculate();
    showToast('鍚屾鎴愬姛', 'success', '宸插簲鐢ㄣ€? + scenario.name + '銆嶅満鏅暟鎹紙璁＄畻椤靛凡鑷姩鏇存柊锛?);
  }, 800);
}

function syncByDate() {
  var date = document.getElementById('date-sync-input').value;
  if (!date) {
    showToast('鏃ユ湡鏈€夋嫨', 'error', '璇烽€夋嫨瑕佸悓姝ョ殑鏃ユ湡');
    return;
  }
  var syncBtn = document.getElementById('sync-btn');
  syncBtn.classList.add('syncing');
  setTimeout(function() {
    syncBtn.classList.remove('syncing');
    var data = MOCK_HISTORY_DATA[date];
    if (!data) {
      showToast('鏃犳暟鎹?, 'info', date + ' 鏆傛棤鍋ヨ韩璁板綍');
      return;
    }
    state.exercises = [];
    state.syncedExerciseCalories = 0;
    data.exercises.forEach(function(ex) {
      var exData = EXERCISE_DB[ex.key];
      if (exData) {
        var cal = Math.round(exData.met * state.weight * (ex.duration / 60));
        state.exercises.push({ key: ex.key, name: exData.name, met: exData.met, duration: ex.duration, calories: cal });
        state.syncedExerciseCalories += cal;
      }
    });
    state.syncedDietCalories = data.dietCalories;
    if (data.activityLevel) {
      state.activityLevel = data.activityLevel;
      renderActivityList();
      if (state.bmr) calculateTDEE();
    }
    renderExerciseList();
    renderSyncedDietList();
    updateEnergyBalance();
    updateInsights();
    document.getElementById('scenario-selector').classList.add('hidden');
    calculate();
    showToast('鍚屾鎴愬姛', 'success', '宸插悓姝?' + date + ' 鐨勫仴韬暟鎹?);
  }, 1000);
}

function fillExampleData() {
  document.getElementById('age-input').value = 28;
  document.getElementById('height-input').value = 175;
  document.getElementById('weight-input').value = 70;
  selectGender('male');
  selectActivity('moderate');
  selectGoal('cut');
  calculate();
}

function renderExerciseDropdown() {
  var tabsHtml = '';
  EXERCISE_CATEGORIES.forEach(function(cat, i) {
    tabsHtml += '<button class="ex-cat-tab' + (i === 0 ? ' active' : '') + '" onclick="filterExercisesByCategory(\'' + cat.key + '\', this)">' + cat.label + '</button>';
  });
  document.getElementById('ex-cat-tabs').innerHTML = tabsHtml;
  renderExerciseOptions('all');
}

function renderExerciseOptions(category) {
  var html = '';
  Object.keys(EXERCISE_DB).forEach(function(key) {
    var ex = EXERCISE_DB[key];
    if (category !== 'all' && ex.category !== category) return;
    html += '<div class="ex-option" data-key="' + key + '" onclick="selectExercise(\'' + key + '\')">' + ex.name + '</div>';
  });
  document.getElementById('ex-options-list').innerHTML = html;
}

function filterExercisesByCategory(category, btn) {
  document.querySelectorAll('.ex-cat-tab').forEach(function(t) { t.classList.remove('active'); });
  btn.classList.add('active');
  renderExerciseOptions(category);
}

function filterExercises() {
  var query = document.getElementById('ex-search-input').value.toLowerCase();
  document.querySelectorAll('.ex-option').forEach(function(opt) {
    var name = opt.textContent.toLowerCase();
    opt.style.display = name.indexOf(query) >= 0 ? '' : 'none';
  });
}

function selectExercise(key) {
  state.selectedExercise = key;
  var trigger = document.getElementById('ex-select-trigger');
  trigger.textContent = EXERCISE_DB[key].name;
  trigger.classList.add('has-value');
  toggleExerciseDropdown();
}

function toggleExerciseDropdown() {
  var dropdown = document.getElementById('ex-dropdown');
  dropdown.classList.toggle('open');
}

function addExercise() {
  if (!state.selectedExercise) { showToast('鏈€夋嫨', 'error', '璇峰厛閫夋嫨杩愬姩绫诲瀷'); return; }
  if (!state.weight) { showToast('缂哄皯浣撻噸', 'error', '璇峰厛鍦ㄨ绠楅〉濉啓浣撻噸'); return; }
  var ex = EXERCISE_DB[state.selectedExercise];
  var duration = state.exerciseDuration || 30;
  var cal = Math.round(ex.met * state.weight * (duration / 60));
  state.exercises.push({ key: state.selectedExercise, name: ex.name, met: ex.met, duration: duration, calories: cal, id: Date.now() });
  state.selectedExercise = '';
  document.getElementById('ex-select-trigger').textContent = '閫夋嫨杩愬姩绫诲瀷';
  document.getElementById('ex-select-trigger').classList.remove('has-value');
  renderExerciseList();
  updateEnergyBalance();
}

function renderExerciseList() {
  var list = document.getElementById('exercise-list');
  if (state.exercises.length === 0) {
    list.innerHTML = '<div class="exercise-list-empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 6.5h11M6.5 17.5h11M3 9.5h2M3 14.5h2M19 9.5h2M19 14.5h2M6.5 9.5v5M17.5 9.5v5M8.5 9.5v5M15.5 9.5v5"/></svg><div>鏆傛棤杩愬姩璁板綍锛岀偣鍑讳笂鏂规坊鍔?/div></div>';
    document.getElementById('exercise-summary').classList.add('hidden');
    return;
  }
  var html = '';
  var total = 0;
  state.exercises.forEach(function(ex, i) {
    total += ex.calories;
    html += '<div class="exercise-item" id="ex-item-' + i + '">' +
      '<div class="ex-item-row"><span class="ex-name">' + ex.name + '</span>' +
      '<span class="ex-met">MET ' + ex.met.toFixed(1) + '</span>' +
      '<span class="ex-cal">' + ex.calories + ' kcal</span>' +
      '<button class="ex-remove" onclick="removeExercise(' + i + ')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div>' +
      '<div class="ex-duration-row"><input type="number" class="ex-duration-input" value="' + ex.duration + '" onchange="updateExerciseDuration(' + i + ', this.value)"><span class="ex-duration-unit">鍒嗛挓</span>' +
      '<div class="ex-quick-durs"><button class="ex-quick-dur" onclick="updateExerciseDuration(' + i + ',15)">15</button><button class="ex-quick-dur" onclick="updateExerciseDuration(' + i + ',30)">30</button><button class="ex-quick-dur" onclick="updateExerciseDuration(' + i + ',45)">45</button><button class="ex-quick-dur" onclick="updateExerciseDuration(' + i + ',60)">60</button></div></div></div>';
  });
  list.innerHTML = html;
  document.getElementById('exercise-summary').classList.remove('hidden');
  document.getElementById('exercise-total').textContent = total + ' kcal';
}

function removeExercise(idx) {
  var item = document.getElementById('ex-item-' + idx);
  if (item) {
    item.classList.add('removing');
    setTimeout(function() {
      state.exercises.splice(idx, 1);
      renderExerciseList();
      updateEnergyBalance();
    }, 450);
  }
}

function updateExerciseDuration(idx, val) {
  var dur = parseInt(val) || 30;
  state.exercises[idx].duration = dur;
  state.exercises[idx].calories = Math.round(state.exercises[idx].met * state.weight * (dur / 60));
  renderExerciseList();
  updateEnergyBalance();
}

function addCustomDiet() {
  var name = document.getElementById('diet-name-input').value.trim();
  var cal = parseInt(document.getElementById('diet-cal-input').value);
  if (!name) { showToast('缂哄皯鍚嶇О', 'error', '璇疯緭鍏ラ鐗╁悕绉?); return; }
  if (!cal || cal <= 0) { showToast('缂哄皯鐑噺', 'error', '璇疯緭鍏ユ湁鏁堢儹閲忓€?); return; }
  state.dietItems.push({ name: name, calories: cal, serving: '', id: Date.now(), custom: true });
  document.getElementById('diet-name-input').value = '';
  document.getElementById('diet-cal-input').value = '';
  renderDietList();
  updateEnergyBalance();
}

function renderSyncedDietList() {
  state.dietItems = [];
  if (state.syncedDietCalories > 0) {
    var items = [
      { name: '鏃╅', calories: Math.round(state.syncedDietCalories * 0.3), serving: '绾?0%', synced: true },
      { name: '鍗堥', calories: Math.round(state.syncedDietCalories * 0.4), serving: '绾?0%', synced: true },
      { name: '鏅氶', calories: Math.round(state.syncedDietCalories * 0.3), serving: '绾?0%', synced: true }
    ];
    state.dietItems = items;
  }
  renderDietList();
}

function renderDietList() {
  var list = document.getElementById('diet-list');
  if (state.dietItems.length === 0) {
    list.innerHTML = '<div class="exercise-list-empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8h1a4 4 0 010 8h-1"/><path d="M2 8h16v9a4 4 0 01-4 4H6a4 4 0 01-4-4V8z"/><line x1="6" y1="1" x2="6" y2="4"/><line x1="10" y1="1" x2="10" y2="4"/><line x1="14" y1="1" x2="14" y2="4"/></svg><div>鏆傛棤楗璁板綍锛屾坊鍔犻鐗╁紑濮嬭褰?/div></div>';
    document.getElementById('diet-total').classList.add('hidden');
    return;
  }
  var html = '';
  var total = 0;
  state.dietItems.forEach(function(item, i) {
    total += item.calories;
    html += '<div class="diet-item">' +
      '<div class="diet-emoji"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8h1a4 4 0 010 8h-1"/><path d="M2 8h16v9a4 4 0 01-4 4H6a4 4 0 01-4-4V8z"/><line x1="6" y1="1" x2="6" y2="4"/><line x1="10" y1="1" x2="10" y2="4"/><line x1="14" y1="1" x2="14" y2="4"/></svg></div>' +
      '<span class="diet-name">' + item.name + '</span>' +
      (item.serving ? '<span class="diet-serving">' + item.serving + '</span>' : '') +
      (item.synced ? '<span class="diet-sync-badge">鍚屾</span>' : '') +
      '<span class="diet-cal">' + item.calories + ' kcal</span>' +
      '<button class="diet-remove" onclick="removeDietItem(' + i + ')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div>';
  });
  list.innerHTML = html;
  document.getElementById('diet-total').classList.remove('hidden');
  document.getElementById('diet-total-value').textContent = total + ' kcal';
}

function removeDietItem(idx) {
  state.dietItems.splice(idx, 1);
  renderDietList();
  updateEnergyBalance();
}

function updateEnergyBalance() {
  var intake = 0;
  state.dietItems.forEach(function(item) { intake += item.calories; });
  var burn = state.tdee || 0;
  state.exercises.forEach(function(ex) { burn += ex.calories; });
  document.getElementById('balance-intake').textContent = intake;
  document.getElementById('balance-burn').textContent = burn;
  var maxVal = Math.max(intake, burn, 1);
  document.getElementById('balance-bar-fill').style.width = (intake / maxVal * 100) + '%';
  document.getElementById('balance-bar-marker').style.left = (burn / maxVal * 100) + '%';
  var statusEl = document.getElementById('balance-status');
  var diff = intake - burn;
  if (Math.abs(diff) < 100) {
    statusEl.textContent = '骞宠　';
    statusEl.className = 'balance-status balanced';
  } else if (diff < 0) {
    statusEl.textContent = '缂哄彛 ' + Math.abs(diff) + ' kcal';
    statusEl.className = 'balance-status deficit';
  } else {
    statusEl.textContent = '鐩堜綑 ' + diff + ' kcal';
    statusEl.className = 'balance-status surplus';
  }
}

function updateInsights() {
  var bmiEl = document.getElementById('bmi-value');
  var labelEl = document.getElementById('bmi-label');
  var pointerEl = document.getElementById('bmi-pointer');
  var idealEl = document.getElementById('bmi-ideal');

  if (state.height > 0 && state.weight > 0) {
    var heightM = state.height / 100;
    var bmi = (state.weight / (heightM * heightM)).toFixed(1);
    bmiEl.textContent = bmi;

    var pointer = 0;
    var label = '';
    var catKey = '';
    var labelClass = '';

    if (bmi < 16) {
      pointer = Math.max((bmi / 18.5) * 30 * 0.7, 2);
      label = '涓ラ噸鍋忕槮';
      catKey = 'underweight';
      labelClass = 'bmi-severe';
    } else if (bmi < 18.5) {
      pointer = (bmi / 18.5) * 30;
      label = '鍋忕槮';
      catKey = 'underweight';
    } else if (bmi < 24) {
      pointer = 30 + ((bmi - 18.5) / 5.5) * 25;
      label = '姝ｅ父';
      catKey = 'normal';
    } else if (bmi < 28) {
      pointer = 55 + ((bmi - 24) / 4) * 20;
      label = '鍋忚儢';
      catKey = 'overweight';
    } else if (bmi < 35) {
      pointer = 75 + ((bmi - 28) / 7) * 15;
      label = '鑲ヨ儢';
      catKey = 'obese';
    } else {
      pointer = Math.min(90 + ((bmi - 35) / 15) * 10, 100);
      label = '閲嶅害鑲ヨ儢';
      catKey = 'obese';
      labelClass = 'bmi-severe';
    }

    pointerEl.style.left = pointer + '%';
    labelEl.textContent = label;
    labelEl.className = 'bmi-label ' + labelClass;

    document.querySelectorAll('.bmi-cat').forEach(function(cat) {
      var isActive = cat.dataset.cat === catKey;
      cat.classList.toggle('active', isActive);
      cat.classList.toggle('severe-warn', isActive && !!labelClass);
    });

    if (bmi >= 18.5 && bmi < 24) {
      idealEl.classList.remove('hidden');
      document.getElementById('bmi-ideal-text').textContent = '浣撻噸鍦ㄥ仴搴疯寖鍥村唴锛孊MI ' + bmi;
    } else {
      var idealLow = (18.5 * heightM * heightM).toFixed(1);
      var idealHigh = (23.9 * heightM * heightM).toFixed(1);
      idealEl.classList.remove('hidden');
      document.getElementById('bmi-ideal-text').textContent = '鍋ュ悍浣撻噸鑼冨洿锛? + idealLow + ' - ' + idealHigh + ' kg';
    }
  } else {
    bmiEl.textContent = '--';
    labelEl.textContent = '绛夊緟鏁版嵁';
    labelEl.className = 'bmi-label';
    pointerEl.style.left = '0%';
    idealEl.classList.add('hidden');
    document.querySelectorAll('.bmi-cat').forEach(function(cat) {
      cat.classList.remove('active');
      cat.classList.remove('severe-warn');
    });
  }

  if (state.weight > 0) {
    var baseWater = Math.round(state.weight * 35);
    var exerciseWater = 0;
    state.exercises.forEach(function(ex) { exerciseWater += Math.round(ex.duration * 8); });
    var totalWater = baseWater + exerciseWater;
    document.getElementById('water-amount').textContent = totalWater;
    document.getElementById('water-base').textContent = baseWater + 'ml';
    document.getElementById('water-exercise').textContent = exerciseWater + 'ml';
    document.getElementById('water-total').textContent = totalWater + 'ml';
    document.getElementById('water-tip').textContent = '浣撻噸' + state.weight + 'kg 脳 35ml + 杩愬姩琛ユ按';
    var fillPct = Math.min((totalWater / 3500) * 100, 90);
    var fillEl = document.getElementById('water-drop-fill');
    if (fillEl) {
      fillEl.style.height = fillPct + '%';
    }
  }
}

function testBmiExtreme(targetBmi) {
  var height = 170;
  var weight = (targetBmi * (height / 100) * (height / 100)).toFixed(1);
  document.getElementById('height-input').value = height;
  document.getElementById('weight-input').value = weight;
  document.getElementById('age-input').value = 25;
  selectGender('male');
  calculate();
  switchTab('insight');
  showToast('BMI ' + targetBmi, 'info', '韬珮' + height + 'cm / 浣撻噸' + weight + 'kg');
}

function showToast(title, type, detail) {
  var toast = document.getElementById('sync-toast');
  var icon = document.getElementById('toast-icon');
  document.getElementById('toast-title').textContent = title;
  document.getElementById('toast-detail').textContent = detail || '';
  icon.className = 'toast-icon ' + type;
  var iconSvg = '';
  if (type === 'success') iconSvg = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';
  else if (type === 'error') iconSvg = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>';
  else iconSvg = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>';
  icon.innerHTML = iconSvg;
  toast.classList.add('show');
  setTimeout(function() { toast.classList.remove('show'); }, 2500);
}

document.addEventListener('click', function(e) {
  var wrapper = document.getElementById('ex-select-wrapper');
  var dropdown = document.getElementById('ex-dropdown');
  if (wrapper && dropdown && !wrapper.contains(e.target)) {
    dropdown.classList.remove('open');
  }
});

init();
</script>
