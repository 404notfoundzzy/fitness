<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>9 页面加载动画效果预览</title>
<style>
:root { --bg: #000; --panel: #050505; --border: rgba(255,255,255,0.08); --text: #fff; --muted: rgba(255,255,255,0.5); }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: "SF Pro Display","PingFang SC","Helvetica Neue",sans-serif; background: var(--bg); color: var(--text); padding: 32px 20px 80px; }
.page { max-width: 1200px; margin: 0 auto; }
.hero { text-align: center; margin-bottom: 40px; }
.hero .eyebrow { font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--muted); margin-bottom: 12px; }
.hero h1 { font-size: clamp(22px,4vw,34px); line-height: 1.1; font-weight: 600; margin-bottom: 8px; }
.hero .sub { font-size: 14px; color: var(--muted); }
.gallery { display: grid; grid-template-columns: repeat(auto-fill,minmax(340px,1fr)); gap: 20px; }
.card { border: 1px solid var(--border); border-radius: 20px; background: linear-gradient(180deg,rgba(255,255,255,0.035),rgba(255,255,255,0.01)),var(--panel); overflow: hidden; }
.card-phone { position: relative; height: 320px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.card-phone .page-title { position: absolute; top: 16px; left: 20px; font-size: 13px; font-weight: 600; color: rgba(255,255,255,0.7); }
.card-phone .page-path { position: absolute; top: 36px; left: 20px; font-size: 10px; color: rgba(255,255,255,0.3); font-family: "SF Mono","Menlo",monospace; }
.card-svg { width: 180px; height: 180px; overflow: visible; }
.card-info { padding: 16px 20px; border-top: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
.card-label { font-size: 14px; font-weight: 600; }
.card-anim { font-size: 11px; color: var(--muted); font-family: "SF Mono","Menlo",monospace; }
.card-color-dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }
.card-code { padding: 10px 20px 14px; font-family: "SF Mono","Menlo",monospace; font-size: 11px; color: rgba(255,255,255,0.5); line-height: 1.6; border-top: 1px solid rgba(255,255,255,0.04); }
.card-code .tag { color: #6ee7b7; }
.card-code .attr { color: #f0abfc; }
.card-code .val { color: #fbbf24; }
</style>
</head>
<body>
<div class="page">
  <section class="hero">
    <p class="eyebrow">MathCurveLoader Integration Preview</p>
    <h1>9 页面加载动画效果确认</h1>
    <p class="sub">每个页面使用不同的动画和主题色，确认颜色与页面风格匹配</p>
  </section>
  <div id="app" class="gallery"></div>
</div>
<script>
const curves = [
  { name:'original-thinking', label:'Original Thinking', tag:'Custom Rose Trail', descriptionZh:'基础圆周叠加了 7 倍频余弦项，轨迹长成旋转中的七瓣花环。', rotate:true, particleCount:64, trailSpan:0.38, durationMs:4600, rotationDurationMs:28000, pulseDurationMs:4200, strokeWidth:5.5, config:{baseRadius:7,detailAmplitude:3,petalCount:7,curveScale:3.9}, point(p,ds,c){const t=p*Math.PI*2,k=Math.round(c.petalCount);return{x:50+(c.baseRadius*Math.cos(t)-c.detailAmplitude*ds*Math.cos(k*t))*c.curveScale,y:50+(c.baseRadius*Math.sin(t)-c.detailAmplitude*ds*Math.sin(k*t))*c.curveScale}}},
  { name:'thinking-five', label:'Thinking Five', tag:'Custom Rose Trail', descriptionZh:'5 倍频项替代 7 倍频，轨迹呈现更简洁的五瓣节奏。', rotate:true, particleCount:62, trailSpan:0.38, durationMs:4600, rotationDurationMs:28000, pulseDurationMs:4200, strokeWidth:5.5, config:{baseRadius:7,detailAmplitude:3,petalCount:5,curveScale:3.9}, point(p,ds,c){const t=p*Math.PI*2,k=Math.round(c.petalCount);return{x:50+(c.baseRadius*Math.cos(t)-c.detailAmplitude*ds*Math.cos(k*t))*c.curveScale,y:50+(c.baseRadius*Math.sin(t)-c.detailAmplitude*ds*Math.sin(k*t))*c.curveScale}}},
  { name:'thinking-nine', label:'Thinking Nine', tag:'Custom Rose Trail', descriptionZh:'9 倍频项把更多小回环压进同一圈轨道，花环更密更细。', rotate:true, particleCount:68, trailSpan:0.39, durationMs:4700, rotationDurationMs:30000, pulseDurationMs:4200, strokeWidth:5.5, config:{baseRadius:7,detailAmplitude:3,petalCount:9,curveScale:3.9}, point(p,ds,c){const t=p*Math.PI*2,k=Math.round(c.petalCount);return{x:50+(c.baseRadius*Math.cos(t)-c.detailAmplitude*ds*Math.cos(k*t))*c.curveScale,y:50+(c.baseRadius*Math.sin(t)-c.detailAmplitude*ds*Math.sin(k*t))*c.curveScale}}},
  { name:'rose-orbit', label:'Rose Orbit', tag:'r = cos(kθ)', descriptionZh:'半径随 cos(7t) 起伏，轨迹在圆周上反复鼓起花瓣。', rotate:true, particleCount:72, trailSpan:0.42, durationMs:5200, rotationDurationMs:28000, pulseDurationMs:4600, strokeWidth:5.2, config:{orbitRadius:7,detailAmplitude:2.7,petalCount:7,curveScale:3.9}, point(p,ds,c){const t=p*Math.PI*2,k=Math.round(c.petalCount),r=c.orbitRadius-c.detailAmplitude*ds*Math.cos(k*t);return{x:50+Math.cos(t)*r*c.curveScale,y:50+Math.sin(t)*r*c.curveScale}}},
  { name:'rose-curve', label:'Rose Curve', tag:'r = a cos(kθ)', descriptionZh:'r = a cos(5t) 生成五个均匀花瓣，呼吸倍率让花瓣轻微胀缩。', rotate:true, particleCount:78, trailSpan:0.32, durationMs:5400, rotationDurationMs:28000, pulseDurationMs:4600, strokeWidth:4.5, config:{roseA:9.2,roseABoost:0.6,roseBreathBase:0.72,roseBreathBoost:0.28,roseK:5,roseScale:3.25}, point(p,ds,c){const t=p*Math.PI*2,a=c.roseA+ds*c.roseABoost,k=Math.round(c.roseK),r=a*(c.roseBreathBase+ds*c.roseBreathBoost)*Math.cos(k*t);return{x:50+Math.cos(t)*r*c.roseScale,y:50+Math.sin(t)*r*c.roseScale}}},
  { name:'rose-two', label:'Rose Two', tag:'r = a cos(2θ)', descriptionZh:'k=2 时余弦半径生成宽阔对称花瓣，呼吸倍率让中心鼓动。', rotate:true, particleCount:74, trailSpan:0.3, durationMs:5200, rotationDurationMs:28000, pulseDurationMs:4300, strokeWidth:4.6, config:{roseA:9.2,roseABoost:0.6,roseBreathBase:0.72,roseBreathBoost:0.28,roseScale:3.25}, point(p,ds,c){const t=p*Math.PI*2,a=c.roseA+ds*c.roseABoost,r=a*(c.roseBreathBase+ds*c.roseBreathBoost)*Math.cos(2*t);return{x:50+Math.cos(t)*r*c.roseScale,y:50+Math.sin(t)*r*c.roseScale}}},
  { name:'rose-three', label:'Rose Three', tag:'r = a cos(3θ)', descriptionZh:'k=3 时曲线落成三瓣旋转结构，内层呼吸感避免静态感。', rotate:true, particleCount:76, trailSpan:0.31, durationMs:5300, rotationDurationMs:28000, pulseDurationMs:4400, strokeWidth:4.6, config:{roseA:9.2,roseABoost:0.6,roseBreathBase:0.72,roseBreathBoost:0.28,roseScale:3.25}, point(p,ds,c){const t=p*Math.PI*2,a=c.roseA+ds*c.roseABoost,r=a*(c.roseBreathBase+ds*c.roseBreathBoost)*Math.cos(3*t);return{x:50+Math.cos(t)*r*c.roseScale,y:50+Math.sin(t)*r*c.roseScale}}},
  { name:'rose-four', label:'Rose Four', tag:'r = a cos(4θ)', descriptionZh:'k=4 时花瓣呈十字形玫瑰，呼吸核心添加柔和脉冲。', rotate:true, particleCount:74, trailSpan:0.3, durationMs:5200, rotationDurationMs:28000, pulseDurationMs:4300, strokeWidth:4.6, config:{roseA:9.2,roseABoost:0.6,roseBreathBase:0.72,roseBreathBoost:0.28,roseScale:3.25}, point(p,ds,c){const t=p*Math.PI*2,a=c.roseA+ds*c.roseABoost,r=a*(c.roseBreathBase+ds*c.roseBreathBoost)*Math.cos(4*t);return{x:50+Math.cos(t)*r*c.roseScale,y:50+Math.sin(t)*r*c.roseScale}}},
  { name:'lissajous-drift', label:'Lissajous Drift', tag:'x = sin(at), y = sin(bt)', descriptionZh:'不同频率的正弦函数让路径反复交叉，产生示波器般的编织感。', rotate:true, particleCount:80, trailSpan:0.34, durationMs:5800, rotationDurationMs:32000, pulseDurationMs:4800, strokeWidth:4.2, config:{lissA:3,lissB:4,lissDelta:0.5,lissScale:8.5}, point(p,ds,c){const t=p*Math.PI*2;return{x:50+Math.sin(c.lissA*t+c.lissDelta+ds*0.3)*c.lissScale,y:50+Math.sin(c.lissB*t)*c.lissScale}}},
  { name:'lemniscate-bloom', label:'Lemniscate Bloom', tag:'Bernoulli Lemniscate', descriptionZh:'1 + sin²t 分母夹住中心同时保留两瓣，曲线像呼吸的无穷符号。', rotate:true, particleCount:72, trailSpan:0.36, durationMs:5000, rotationDurationMs:26000, pulseDurationMs:4400, strokeWidth:4.8, config:{lemScale:28,lemBreathBase:0.8,lemBreathBoost:0.2}, point(p,ds,c){const t=p*Math.PI*2,s=c.lemBreathBase+ds*c.lemBreathBoost,d=1+Math.sin(t)*Math.sin(t);return{x:50+(c.lemScale*s*Math.cos(t))/d,y:50+(c.lemScale*s*Math.sin(t)*Math.cos(t))/d}}},
  { name:'hypotrochoid-loop', label:'Hypotrochoid Loop', tag:'Inner Spirograph', descriptionZh:'滚圆项创建嵌套转弯和偏移，路径像机器绘制的紧凑螺旋图。', rotate:true, particleCount:82, trailSpan:0.33, durationMs:5600, rotationDurationMs:30000, pulseDurationMs:4600, strokeWidth:4.3, config:{R:5,r:3,d:5,hypoScale:3.2}, point(p,ds,c){const t=p*Math.PI*2,s=0.8+ds*0.2;return{x:50+((c.R-c.r)*Math.cos(t)+c.d*s*Math.cos((c.R-c.r)/c.r*t))*c.hypoScale,y:50+((c.R-c.r)*Math.sin(t)-c.d*s*Math.sin((c.R-c.r)/c.r*t))*c.hypoScale}}},
  { name:'three-petal-spiral', label:'Three-Petal Spiral', tag:'R=3, r=1, d=3', descriptionZh:'滚圆设置生成三个大环花瓣，像紧凑的螺旋花一起呼吸。', rotate:true, particleCount:70, trailSpan:0.35, durationMs:5200, rotationDurationMs:28000, pulseDurationMs:4400, strokeWidth:4.8, config:{R:3,r:1,d:3,hypoScale:6.5}, point(p,ds,c){const t=p*Math.PI*2,s=0.8+ds*0.2;return{x:50+((c.R-c.r)*Math.cos(t)+c.d*s*Math.cos((c.R-c.r)/c.r*t))*c.hypoScale,y:50+((c.R-c.r)*Math.sin(t)-c.d*s*Math.sin((c.R-c.r)/c.r*t))*c.hypoScale}}},
  { name:'four-petal-spiral', label:'Four-Petal Spiral', tag:'R=4, r=1, d=3', descriptionZh:'R=4 时滚圆路径落成四个环花瓣，旋转呼吸如一环。', rotate:true, particleCount:72, trailSpan:0.35, durationMs:5400, rotationDurationMs:28000, pulseDurationMs:4400, strokeWidth:4.6, config:{R:4,r:1,d:3,hypoScale:5.2}, point(p,ds,c){const t=p*Math.PI*2,s=0.8+ds*0.2;return{x:50+((c.R-c.r)*Math.cos(t)+c.d*s*Math.cos((c.R-c.r)/c.r*t))*c.hypoScale,y:50+((c.R-c.r)*Math.sin(t)-c.d*s*Math.sin((c.R-c.r)/c.r*t))*c.hypoScale}}},
  { name:'five-petal-spiral', label:'Five-Petal Spiral', tag:'R=5, r=1, d=3', descriptionZh:'R=5 时环数增至五瓣，螺旋花更密更华丽。', rotate:true, particleCount:74, trailSpan:0.35, durationMs:5600, rotationDurationMs:30000, pulseDurationMs:4600, strokeWidth:4.4, config:{R:5,r:1,d:3,hypoScale:4.2}, point(p,ds,c){const t=p*Math.PI*2,s=0.8+ds*0.2;return{x:50+((c.R-c.r)*Math.cos(t)+c.d*s*Math.cos((c.R-c.r)/c.r*t))*c.hypoScale,y:50+((c.R-c.r)*Math.sin(t)-c.d*s*Math.sin((c.R-c.r)/c.r*t))*c.hypoScale}}},
  { name:'six-petal-spiral', label:'Six-Petal Spiral', tag:'R=6, r=1, d=3', descriptionZh:'滚圆路径分成六瓣，整环统一呼吸如原版加载器。', rotate:true, particleCount:76, trailSpan:0.35, durationMs:5800, rotationDurationMs:32000, pulseDurationMs:4800, strokeWidth:4.2, config:{R:6,r:1,d:3,hypoScale:3.5}, point(p,ds,c){const t=p*Math.PI*2,s=0.8+ds*0.2;return{x:50+((c.R-c.r)*Math.cos(t)+c.d*s*Math.cos((c.R-c.r)/c.r*t))*c.hypoScale,y:50+((c.R-c.r)*Math.sin(t)-c.d*s*Math.sin((c.R-c.r)/c.r*t))*c.hypoScale}}},
  { name:'butterfly-phase', label:'Butterfly Phase', tag:'Butterfly Curve', descriptionZh:'指数和高频余弦项不对称地拉伸翅膀，路径呈蝴蝶振翅形状。', rotate:true, particleCount:90, trailSpan:0.28, durationMs:6200, rotationDurationMs:36000, pulseDurationMs:5000, strokeWidth:3.8, config:{bflyScale:3.2}, point(p,ds,c){const t=p*Math.PI*4,s=0.85+ds*0.15,r=Math.exp(Math.sin(t))-2*Math.cos(4*t)+Math.pow(Math.sin((2*t-Math.PI)/24),5);return{x:50+Math.cos(t)*r*c.bflyScale*s,y:50+Math.sin(t)*r*c.bflyScale*s}}},
  { name:'cardioid-glow', label:'Cardioid Glow', tag:'Cardioid', descriptionZh:'r = a(1 - cos t) 一侧收缩为零另一侧膨胀，曲线像柔和脉冲心波。', rotate:true, particleCount:68, trailSpan:0.38, durationMs:4800, rotationDurationMs:26000, pulseDurationMs:4200, strokeWidth:5.0, config:{cardioidA:5.5,cardioidScale:4.2}, point(p,ds,c){const t=p*Math.PI*2,s=0.8+ds*0.2,r=c.cardioidA*(1-Math.cos(t))*s;return{x:50+Math.cos(t)*r*c.cardioidScale,y:50+Math.sin(t)*r*c.cardioidScale}}},
  { name:'cardioid-heart', label:'Cardioid Heart', tag:'r = a(1 + cosθ)', descriptionZh:'从 r = a(1 + cos t) 出发并旋转坐标，教科书心形线变成直立心形。', rotate:true, particleCount:68, trailSpan:0.38, durationMs:4800, rotationDurationMs:26000, pulseDurationMs:4200, strokeWidth:5.0, config:{cardioidA:5.5,cardioidScale:4.2}, point(p,ds,c){const t=p*Math.PI*2,s=0.8+ds*0.2,r=c.cardioidA*(1+Math.cos(t))*s,a=t-Math.PI/2;return{x:50+Math.cos(a)*r*c.cardioidScale,y:50+Math.sin(a)*r*c.cardioidScale}}},
  { name:'heart-wave', label:'Heart Wave', tag:'f(x) Heart Wave', descriptionZh:'x^(2/3) 包络提供心形轮廓，sin(bπx) 在内部填充可调水平波纹。', rotate:true, particleCount:80, trailSpan:0.34, durationMs:5400, rotationDurationMs:30000, pulseDurationMs:4600, strokeWidth:4.4, config:{heartScale:5.5,heartB:6}, point(p,ds,c){const t=(p-0.5)*2,s=0.85+ds*0.15,x=t*c.heartScale,envelope=Math.pow(Math.abs(t),2/3),wave=Math.sin(c.heartB*Math.PI*t)*0.15*s;return{x:50+x,y:50-(envelope+wave)*c.heartScale*1.2}}},
  { name:'spiral-search', label:'Spiral Search', tag:'Archimedean Spiral', descriptionZh:'快速增长的角配合余弦调制半径，螺旋向外展开后干净地收回。', rotate:true, particleCount:86, trailSpan:0.3, durationMs:6000, rotationDurationMs:34000, pulseDurationMs:5000, strokeWidth:4.0, config:{spiralGrowth:2.8,spiralScale:1.6,spiralTurns:3}, point(p,ds,c){const t=p*Math.PI*2*c.spiralTurns,s=0.8+ds*0.2,r=c.spiralGrowth*t*s*(1+0.3*Math.cos(t*0.5));return{x:50+Math.cos(t)*r*c.spiralScale,y:50+Math.sin(t)*r*c.spiralScale}}},
  { name:'fourier-flow', label:'Fourier Flow', tag:'Fourier Curve', descriptionZh:'多个正弦余弦分量互相干涉，形状像活着的波形不断变异。', rotate:true, particleCount:88, trailSpan:0.3, durationMs:6200, rotationDurationMs:34000, pulseDurationMs:5000, strokeWidth:4.0, config:{fourierScale:6}, point(p,ds,c){const t=p*Math.PI*2,s=0.85+ds*0.15;return{x:50+(Math.sin(t)+0.5*Math.sin(2*t)+0.3*Math.cos(3*t+s))*c.fourierScale,y:50+(Math.cos(t)+0.5*Math.cos(2*t)+0.3*Math.sin(3*t+s))*c.fourierScale}}},
]
const curveMap = {}
curves.forEach(c => { curveMap[c.name] = c })

const SVG_NS = "http://www.w3.org/2000/svg"

const pages = [
  { label: '首页', path: 'pages/index/index', anim: 'rose-three', color: '#A855F7', size: 240, text: '正在加载今日数据...' },
  { label: '健康记录', path: 'pages/record/record', anim: 'fourier-flow', color: '#0EA5E9', size: 220, text: '正在加载动态...' },
  { label: '运动历史', path: 'pages/record/history/history', anim: 'spiral-search', color: '#F97316', size: 220, text: '正在加载历史记录...' },
  { label: '体重历史', path: 'pages/record/weight/weight-history', anim: 'cardioid-glow', color: '#14B8A6', size: 220, text: '正在加载体重记录...' },
  { label: '饮水历史', path: 'pages/record/water/water-history', anim: 'lissajous-drift', color: '#38BDF8', size: 220, text: '正在加载饮水记录...' },
  { label: '饮食历史', path: 'pages/record/diet/diet-history', anim: 'lemniscate-bloom', color: '#22C55E', size: 220, text: '正在加载饮食记录...' },
  { label: '身高历史', path: 'pages/record/height/height-history', anim: 'hypotrochoid-loop', color: '#A855F7', size: 220, text: '正在加载身高数据...' },
  { label: '知识库', path: 'pages/knowledge/knowledge', anim: 'butterfly-phase', color: '#0EA5E9', size: 220, text: '正在加载动作库...' },
  { label: '训练计划', path: 'pages/knowledge/training-plan-list', anim: 'rose-four', color: '#0EA5E9', size: 200, text: '正在加载训练计划...' },
]

const app = document.getElementById("app")

function buildPathD(curve, detailScale) {
  const steps = 300
  let d = ""
  for (let i = 0; i <= steps; i++) {
    const progress = i / steps
    const pt = curve.point(progress, detailScale, curve.config)
    d += (i === 0 ? "M" : "L") + pt.x.toFixed(2) + " " + pt.y.toFixed(2)
  }
  return d
}

pages.forEach(page => {
  const curve = curveMap[page.anim]
  if (!curve) return

  const card = document.createElement("div")
  card.className = "card"

  const phone = document.createElement("div")
  phone.className = "card-phone"
  phone.style.background = `radial-gradient(circle at 50% 50%, ${page.color}08, transparent 60%), #0a0a0a`

  const titleEl = document.createElement("div")
  titleEl.className = "page-title"
  titleEl.textContent = page.label
  phone.appendChild(titleEl)

  const pathEl = document.createElement("div")
  pathEl.className = "page-path"
  pathEl.textContent = page.path
  phone.appendChild(pathEl)

  const svg = document.createElementNS(SVG_NS, "svg")
  svg.setAttribute("class", "card-svg")
  svg.setAttribute("viewBox", "0 0 100 100")
  svg.setAttribute("fill", "none")

  const g = document.createElementNS(SVG_NS, "g")
  const path = document.createElementNS(SVG_NS, "path")
  path.setAttribute("stroke", page.color)
  path.setAttribute("stroke-width", String(curve.strokeWidth * 0.6))
  path.setAttribute("stroke-linecap", "round")
  path.setAttribute("stroke-linejoin", "round")
  path.setAttribute("opacity", "0.1")
  g.appendChild(path)

  const particleCount = Math.min(curve.particleCount, 56)
  const particles = []
  for (let i = 0; i < particleCount; i++) {
    const circle = document.createElementNS(SVG_NS, "circle")
    circle.setAttribute("r", "1.2")
    circle.setAttribute("fill", page.color)
    particles.push(circle)
    g.appendChild(circle)
  }
  svg.appendChild(g)

  const textEl = document.createElement("div")
  textEl.style.cssText = `margin-top: 12px; font-size: 12px; color: ${page.color}; opacity: 0.7; letter-spacing: 0.05em;`
  textEl.textContent = page.text

  phone.appendChild(svg)
  phone.appendChild(textEl)
  card.appendChild(phone)

  const info = document.createElement("div")
  info.className = "card-info"
  info.innerHTML = `<span class="card-label"><span class="card-color-dot" style="background:${page.color}"></span>${page.label}</span><span class="card-anim">${page.anim}</span>`
  card.appendChild(info)

  const code = document.createElement("div")
  code.className = "card-code"
  code.innerHTML = `<span class="tag">&lt;MathCurveLoader</span> <span class="attr">name</span>=<span class="val">"${page.anim}"</span> <span class="attr">:size</span>=<span class="val">"${page.size}"</span> <span class="attr">color</span>=<span class="val">"${page.color}"</span> <span class="attr">text</span>=<span class="val">"${page.text}"</span> <span class="tag">/&gt;</span>`
  card.appendChild(code)

  app.appendChild(card)

  const startTime = performance.now()
  function animate(now) {
    const elapsed = now - startTime
    const loopProgress = (elapsed % curve.durationMs) / curve.durationMs
    const pulseProgress = (elapsed % curve.pulseDurationMs) / curve.pulseDurationMs
    const detailScale = 0.5 + 0.5 * Math.sin(pulseProgress * Math.PI * 2)

    if (curve.rotate) {
      const rotProgress = (elapsed % curve.rotationDurationMs) / curve.rotationDurationMs
      g.setAttribute("transform", `rotate(${(rotProgress * 360).toFixed(2)} 50 50)`)
    }

    path.setAttribute("d", buildPathD(curve, detailScale))

    for (let i = 0; i < particleCount; i++) {
      const particleProgress = (loopProgress - (i / particleCount) * curve.trailSpan + 1) % 1
      const pt = curve.point(particleProgress, detailScale, curve.config)
      const opacity = 1 - i / particleCount
      const r = 1.2 * (1 - (i / particleCount) * 0.5)
      particles[i].setAttribute("cx", pt.x.toFixed(2))
      particles[i].setAttribute("cy", pt.y.toFixed(2))
      particles[i].setAttribute("opacity", opacity.toFixed(2))
      particles[i].setAttribute("r", r.toFixed(2))
    }
    requestAnimationFrame(animate)
  }
  requestAnimationFrame(animate)
})
</script>
</body>
</html>
