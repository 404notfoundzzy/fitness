<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>健身部位骨架屏效果对比</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=Noto+Sans+SC:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg-page: #F0F9FF;
  --bg-card: #FFFFFF;
  --primary: #0EA5E9;
  --text-main: #0F172A;
  --text-light: #94A3B8;
  --border: #E2E8F0;
  --skeleton-bg: #e2e8f0;
  --shadow-card: 0 2px 8px rgba(0,0,0,0.04);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Inter', 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--bg-page);
  min-height: 100vh;
  padding: 20px;
}

.page-title {
  text-align: center;
  font-size: 22px;
  font-weight: 800;
  color: var(--text-main);
  margin-bottom: 8px;
}

.page-sub {
  text-align: center;
  font-size: 14px;
  color: var(--text-light);
  margin-bottom: 24px;
}

.compare-wrap {
  display: flex;
  gap: 16px;
  max-width: 820px;
  margin: 0 auto;
}

.compare-panel {
  flex: 1;
  min-width: 0;
}

.panel-label {
  font-size: 13px;
  font-weight: 700;
  color: var(--text-light);
  text-transform: uppercase;
  letter-spacing: 2px;
  margin-bottom: 12px;
  text-align: center;
  padding: 6px 16px;
  border-radius: 20px;
}

.panel-label.skeleton-label {
  background: #FEF3C7;
  color: #B45309;
}

.panel-label.real-label {
  background: #D1FAE5;
  color: #047857;
}

.phone-frame {
  background: var(--bg-page);
  border-radius: 28px;
  padding: 16px;
  border: 2px solid var(--border);
  min-height: 600px;
}

.section-title {
  font-size: 18px;
  font-weight: 800;
  color: var(--text-main);
  margin-bottom: 4px;
}

.section-sub {
  font-size: 13px;
  color: var(--text-light);
  margin-bottom: 16px;
}

/* ========== 骨架屏样式 ========== */
.category-skeleton-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 15px;
}

.category-skeleton-card {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 25px 15px;
  background: var(--bg-card);
  border-radius: 12px;
  box-shadow: var(--shadow-card);
  animation: skeleton-breathe 2s ease-in-out infinite;
}

.category-skeleton-icon {
  width: 60px;
  height: 60px;
  border-radius: 50%;
  background: var(--skeleton-bg);
  margin-bottom: 12px;
}

.category-skeleton-title {
  width: 60%;
  height: 15px;
  border-radius: 4px;
  background: var(--skeleton-bg);
  margin-bottom: 4px;
}

.category-skeleton-sub {
  width: 40%;
  height: 10px;
  border-radius: 3px;
  background: var(--skeleton-bg);
}

.category-skeleton-hint {
  text-align: center;
  font-size: 12px;
  color: #94a3b8;
  margin-top: 16px;
  animation: skeleton-breathe 2s ease-in-out infinite;
}

.skeleton-shimmer {
  position: relative;
  overflow: hidden;
}

.skeleton-shimmer::after {
  content: "";
  position: absolute;
  top: 0;
  left: -150%;
  width: 150%;
  height: 100%;
  background: linear-gradient(
    90deg,
    transparent 0%,
    transparent 20%,
    rgba(255, 255, 255, 0.7) 50%,
    transparent 80%,
    transparent 100%
  );
  animation: shimmer 1.8s ease-in-out infinite;
}

@keyframes shimmer {
  0% { left: -150%; }
  100% { left: 150%; }
}

@keyframes skeleton-breathe {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.5; }
}

/* ========== 真实数据样式 ========== */
.category-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 15px;
}

.category-block {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 25px 15px;
  background: var(--bg-card);
  border-radius: 12px;
  box-shadow: var(--shadow-card);
  cursor: pointer;
  transition: transform 0.2s;
}

.category-block:active {
  transform: scale(0.95);
}

.icon-circle {
  width: 60px;
  height: 60px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 12px;
  box-shadow: 0 5px 10px rgba(0,0,0,0.1);
  font-size: 28px;
}

.cat-label {
  font-size: 15px;
  font-weight: 800;
  color: var(--text-main);
  margin-bottom: 4px;
}

.cat-sub {
  font-size: 10px;
  color: var(--text-light);
  font-weight: 600;
}

/* ========== 切换按钮 ========== */
.toggle-wrap {
  text-align: center;
  margin: 24px auto 0;
  max-width: 820px;
}

.toggle-btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 10px 28px;
  border: none;
  border-radius: 24px;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.2s;
  background: #0EA5E9;
  color: white;
  box-shadow: 0 4px 12px rgba(14,165,233,0.3);
}

.toggle-btn:hover {
  transform: translateY(-1px);
  box-shadow: 0 6px 16px rgba(14,165,233,0.4);
}

.toggle-btn:active {
  transform: scale(0.97);
}

/* ========== 单手机模拟切换模式 ========== */
.single-phone-wrap {
  display: none;
  max-width: 390px;
  margin: 0 auto;
}

.single-phone-frame {
  background: var(--bg-page);
  border-radius: 28px;
  padding: 16px;
  border: 2px solid var(--border);
  min-height: 600px;
  position: relative;
}

.state-badge {
  position: absolute;
  top: -10px;
  left: 50%;
  transform: translateX(-50%);
  padding: 4px 16px;
  border-radius: 12px;
  font-size: 12px;
  font-weight: 700;
  z-index: 10;
  transition: all 0.3s;
}

.state-badge.loading {
  background: #FEF3C7;
  color: #B45309;
}

.state-badge.loaded {
  background: #D1FAE5;
  color: #047857;
}

/* ========== 动画过渡 ========== */
.fade-enter {
  animation: fadeIn 0.4s ease forwards;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ========== 旧版骨架屏对比 ========== */
.old-skeleton-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 15px;
}

.old-skeleton-card {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 15px;
  background: var(--bg-card);
  border-radius: 12px;
  box-shadow: var(--shadow-card);
}

.old-skeleton-icon {
  width: 44px;
  height: 44px;
  border-radius: 12px;
  background: var(--skeleton-bg);
  margin-bottom: 12px;
  position: relative;
  overflow: hidden;
}

.old-skeleton-title {
  width: 60%;
  height: 14px;
  border-radius: 4px;
  background: var(--skeleton-bg);
  margin-bottom: 8px;
  position: relative;
  overflow: hidden;
}

.old-skeleton-sub {
  width: 40%;
  height: 12px;
  border-radius: 3px;
  background: var(--skeleton-bg);
  position: relative;
  overflow: hidden;
}

.old-shimmer::after {
  content: "";
  position: absolute;
  top: 0;
  left: -100%;
  width: 100%;
  height: 100%;
  background: linear-gradient(
    90deg,
    transparent 0%,
    rgba(255, 255, 255, 0.5) 50%,
    transparent 100%
  );
  animation: old-shimmer 1.5s ease-in-out infinite;
}

@keyframes old-shimmer {
  0% { left: -100%; }
  100% { left: 100%; }
}

/* ========== 三栏对比 ========== */
.three-col-wrap {
  display: flex;
  gap: 12px;
  max-width: 1200px;
  margin: 0 auto;
}

.three-col-wrap .compare-panel {
  flex: 1;
  min-width: 0;
}

.panel-label.old-label {
  background: #FEE2E2;
  color: #B91C1C;
}
</style>
</head>
<body>

<div class="page-title">健身部位列表 · 骨架屏效果对比</div>
<div class="page-sub">左边 = 旧版骨架屏（几乎看不出加载） | 中间 = 新版骨架屏 | 右边 = 真实数据</div>

<!-- 三栏对比 -->
<div class="three-col-wrap">
  <!-- 旧版骨架屏 -->
  <div class="compare-panel">
    <div class="panel-label old-label">❌ 旧版骨架屏</div>
    <div class="phone-frame">
      <div class="section-title">健身知识库</div>
      <div class="section-sub">建立你的科学健身观</div>
      <div class="old-skeleton-grid">
        <div class="old-skeleton-card" style="animation-delay: 0s">
          <div class="old-skeleton-icon old-shimmer"></div>
          <div class="old-skeleton-title old-shimmer"></div>
          <div class="old-skeleton-sub old-shimmer"></div>
        </div>
        <div class="old-skeleton-card" style="animation-delay: 0.1s">
          <div class="old-skeleton-icon old-shimmer"></div>
          <div class="old-skeleton-title old-shimmer"></div>
          <div class="old-skeleton-sub old-shimmer"></div>
        </div>
        <div class="old-skeleton-card" style="animation-delay: 0.2s">
          <div class="old-skeleton-icon old-shimmer"></div>
          <div class="old-skeleton-title old-shimmer"></div>
          <div class="old-skeleton-sub old-shimmer"></div>
        </div>
        <div class="old-skeleton-card" style="animation-delay: 0.3s">
          <div class="old-skeleton-icon old-shimmer"></div>
          <div class="old-skeleton-title old-shimmer"></div>
          <div class="old-skeleton-sub old-shimmer"></div>
        </div>
        <div class="old-skeleton-card" style="animation-delay: 0.4s">
          <div class="old-skeleton-icon old-shimmer"></div>
          <div class="old-skeleton-title old-shimmer"></div>
          <div class="old-skeleton-sub old-shimmer"></div>
        </div>
        <div class="old-skeleton-card" style="animation-delay: 0.5s">
          <div class="old-skeleton-icon old-shimmer"></div>
          <div class="old-skeleton-title old-shimmer"></div>
          <div class="old-skeleton-sub old-shimmer"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- 新版骨架屏 -->
  <div class="compare-panel">
    <div class="panel-label skeleton-label">⏳ 新版骨架屏</div>
    <div class="phone-frame">
      <div class="section-title">健身知识库</div>
      <div class="section-sub">建立你的科学健身观</div>
      <div class="category-skeleton-grid">
        <div class="category-skeleton-card" style="animation-delay: 0s">
          <div class="category-skeleton-icon skeleton-shimmer"></div>
          <div class="category-skeleton-title skeleton-shimmer"></div>
          <div class="category-skeleton-sub skeleton-shimmer"></div>
        </div>
        <div class="category-skeleton-card" style="animation-delay: 0.1s">
          <div class="category-skeleton-icon skeleton-shimmer"></div>
          <div class="category-skeleton-title skeleton-shimmer"></div>
          <div class="category-skeleton-sub skeleton-shimmer"></div>
        </div>
        <div class="category-skeleton-card" style="animation-delay: 0.2s">
          <div class="category-skeleton-icon skeleton-shimmer"></div>
          <div class="category-skeleton-title skeleton-shimmer"></div>
          <div class="category-skeleton-sub skeleton-shimmer"></div>
        </div>
        <div class="category-skeleton-card" style="animation-delay: 0.3s">
          <div class="category-skeleton-icon skeleton-shimmer"></div>
          <div class="category-skeleton-title skeleton-shimmer"></div>
          <div class="category-skeleton-sub skeleton-shimmer"></div>
        </div>
        <div class="category-skeleton-card" style="animation-delay: 0.4s">
          <div class="category-skeleton-icon skeleton-shimmer"></div>
          <div class="category-skeleton-title skeleton-shimmer"></div>
          <div class="category-skeleton-sub skeleton-shimmer"></div>
        </div>
        <div class="category-skeleton-card" style="animation-delay: 0.5s">
          <div class="category-skeleton-icon skeleton-shimmer"></div>
          <div class="category-skeleton-title skeleton-shimmer"></div>
          <div class="category-skeleton-sub skeleton-shimmer"></div>
        </div>
      </div>
      <div class="category-skeleton-hint">正在加载健身部位...</div>
    </div>
  </div>

  <!-- 真实数据 -->
  <div class="compare-panel">
    <div class="panel-label real-label">✅ 真实数据</div>
    <div class="phone-frame">
      <div class="section-title">健身知识库</div>
      <div class="section-sub">建立你的科学健身观</div>
      <div class="category-grid">
        <div class="category-block">
          <div class="icon-circle" style="background: #E0F2FE">💪</div>
          <div class="cat-label">胸部肌群</div>
          <div class="cat-sub">3 个动作</div>
        </div>
        <div class="category-block">
          <div class="icon-circle" style="background: #FFE4E6">🔙</div>
          <div class="cat-label">背部肌群</div>
          <div class="cat-sub">3 个动作</div>
        </div>
        <div class="category-block">
          <div class="icon-circle" style="background: #D1FAE5">🦵</div>
          <div class="cat-label">下肢肌群</div>
          <div class="cat-sub">3 个动作</div>
        </div>
        <div class="category-block">
          <div class="icon-circle" style="background: #FEF3C7">🏋️</div>
          <div class="cat-label">肩部肌群</div>
          <div class="cat-sub">2 个动作</div>
        </div>
        <div class="category-block">
          <div class="icon-circle" style="background: #EDE9FE">💪</div>
          <div class="cat-label">手臂肌群</div>
          <div class="cat-sub">2 个动作</div>
        </div>
        <div class="category-block">
          <div class="icon-circle" style="background: #FCE7F3">🔥</div>
          <div class="cat-label">核心训练</div>
          <div class="cat-sub">2 个动作</div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- 自动切换演示 -->
<div class="toggle-wrap">
  <button class="toggle-btn" onclick="toggleAutoDemo()">
    <span id="btn-icon">▶</span>
    <span id="btn-text">播放自动切换演示（骨架屏 → 真实数据）</span>
  </button>
</div>

<div class="single-phone-wrap" id="singlePhoneWrap">
  <div class="single-phone-frame">
    <span class="state-badge loading" id="stateBadge">⏳ 加载中</span>
    <div class="section-title">健身知识库</div>
    <div class="section-sub">建立你的科学健身观</div>
    <div id="demoContent"></div>
  </div>
</div>

<script>
let autoDemoTimer = null;
let isAutoPlaying = false;

function toggleAutoDemo() {
  const wrap = document.getElementById('singlePhoneWrap');
  const btnIcon = document.getElementById('btn-icon');
  const btnText = document.getElementById('btn-text');

  if (isAutoPlaying) {
    clearInterval(autoDemoTimer);
    isAutoPlaying = false;
    btnIcon.textContent = '▶';
    btnText.textContent = '播放自动切换演示（骨架屏 → 真实数据）';
    wrap.style.display = 'none';
    return;
  }

  isAutoPlaying = true;
  btnIcon.textContent = '⏸';
  btnText.textContent = '停止演示';
  wrap.style.display = 'block';

  let showSkeleton = true;

  function renderSkeleton() {
    const badge = document.getElementById('stateBadge');
    badge.className = 'state-badge loading';
    badge.textContent = '⏳ 加载中';

    document.getElementById('demoContent').innerHTML = `
      <div class="category-skeleton-grid">
        <div class="category-skeleton-card" style="animation-delay: 0s">
          <div class="category-skeleton-icon skeleton-shimmer"></div>
          <div class="category-skeleton-title skeleton-shimmer"></div>
          <div class="category-skeleton-sub skeleton-shimmer"></div>
        </div>
        <div class="category-skeleton-card" style="animation-delay: 0.1s">
          <div class="category-skeleton-icon skeleton-shimmer"></div>
          <div class="category-skeleton-title skeleton-shimmer"></div>
          <div class="category-skeleton-sub skeleton-shimmer"></div>
        </div>
        <div class="category-skeleton-card" style="animation-delay: 0.2s">
          <div class="category-skeleton-icon skeleton-shimmer"></div>
          <div class="category-skeleton-title skeleton-shimmer"></div>
          <div class="category-skeleton-sub skeleton-shimmer"></div>
        </div>
        <div class="category-skeleton-card" style="animation-delay: 0.3s">
          <div class="category-skeleton-icon skeleton-shimmer"></div>
          <div class="category-skeleton-title skeleton-shimmer"></div>
          <div class="category-skeleton-sub skeleton-shimmer"></div>
        </div>
        <div class="category-skeleton-card" style="animation-delay: 0.4s">
          <div class="category-skeleton-icon skeleton-shimmer"></div>
          <div class="category-skeleton-title skeleton-shimmer"></div>
          <div class="category-skeleton-sub skeleton-shimmer"></div>
        </div>
        <div class="category-skeleton-card" style="animation-delay: 0.5s">
          <div class="category-skeleton-icon skeleton-shimmer"></div>
          <div class="category-skeleton-title skeleton-shimmer"></div>
          <div class="category-skeleton-sub skeleton-shimmer"></div>
        </div>
      </div>
      <div class="category-skeleton-hint">正在加载健身部位...</div>
    `;
  }

  function renderReal() {
    const badge = document.getElementById('stateBadge');
    badge.className = 'state-badge loaded';
    badge.textContent = '✅ 加载完成';

    document.getElementById('demoContent').innerHTML = `
      <div class="category-grid fade-enter">
        <div class="category-block">
          <div class="icon-circle" style="background: #E0F2FE">💪</div>
          <div class="cat-label">胸部肌群</div>
          <div class="cat-sub">3 个动作</div>
        </div>
        <div class="category-block">
          <div class="icon-circle" style="background: #FFE4E6">🔙</div>
          <div class="cat-label">背部肌群</div>
          <div class="cat-sub">3 个动作</div>
        </div>
        <div class="category-block">
          <div class="icon-circle" style="background: #D1FAE5">🦵</div>
          <div class="cat-label">下肢肌群</div>
          <div class="cat-sub">3 个动作</div>
        </div>
        <div class="category-block">
          <div class="icon-circle" style="background: #FEF3C7">🏋️</div>
          <div class="cat-label">肩部肌群</div>
          <div class="cat-sub">2 个动作</div>
        </div>
        <div class="category-block">
          <div class="icon-circle" style="background: #EDE9FE">💪</div>
          <div class="cat-label">手臂肌群</div>
          <div class="cat-sub">2 个动作</div>
        </div>
        <div class="category-block">
          <div class="icon-circle" style="background: #FCE7F3">🔥</div>
          <div class="cat-label">核心训练</div>
          <div class="cat-sub">2 个动作</div>
        </div>
      </div>
    `;
  }

  renderSkeleton();

  autoDemoTimer = setInterval(() => {
    showSkeleton = !showSkeleton;
    if (showSkeleton) {
      renderSkeleton();
    } else {
      renderReal();
    }
  }, 3000);
}
</script>

</body>
</html>
